<clipPath id="frame"><rect width="480" height="150" rx="12"/></clipPath></defs>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif}</style>
<g clip-path="url(#frame)">
<rect width="480" height="150" fill="#ffffff"/>
<rect width="6" height="150" fill="url(#accent)"/>
</g>
<rect x="0.5" y="0.5" width="479" height="149" rx="11.5" fill="none" stroke="#d0d7de"/>
